# Raid buffs and debuffs to look up in the spell tables of a game build.
# Names only: the scope of each one is read from the game files for the build being extracted, never written here.
# A totem needs two names, the spell that drops it and the aura it gives off.
# Not in the knowledge base: `import-curated` reads kb/curated, not this folder.

