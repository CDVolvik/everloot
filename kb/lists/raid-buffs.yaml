# Raid buffs and debuffs to look up in the spell tables of a game build, by spell id.
# Ids and labels only: the scope of each spell is read from the game files of the build being extracted, never written here.
# How the ids were chosen (by hand, from build 1.60.1.70450, reading each spell's tooltip): the ranks of the
# spell a player casts for the effect, and for a totem the ranks of the aura it gives off, not the spell that
# drops it. Left out on purpose: same-named spells that are triggered helpers (the area cast a Gift or Prayer
# fires, a self-only copy), NPC versions without a rank, and the rank duplicates below.
#   27578 Battle Shout "Rank 6", party only, next to the raid-wide 11551 "Rank 6"
#   364163, 24752 Mark of the Wild; 364161 Arcane Intellect; 8990 Retribution Aura; 27579 Demoralizing Shout
# An id the build does not have is listed under missingSpells; an entry with none is listed in notFound.
# Not in the knowledge base: `import-curated` reads kb/curated, not this folder.

