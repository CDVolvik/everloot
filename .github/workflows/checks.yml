name: Release checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: kb
      - run: npm ci
        working-directory: web
      - run: npm test -- --maxWorkers=2 && npm run typecheck
        working-directory: kb
      - run: npm test && npm run lint && npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python addon/tests/event_identity.py && python addon/tests/collection_contract.py && python addon/tests/auction_contract.py && python addon/tests/gold_contract.py
      - run: python scripts/package-addon.py && git diff --exit-code -- web/public/downloads
