name: Release checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets in any commit (gitleaks 8.30.1, checksum-verified)
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
      - name: No private workspace paths
        run: python scripts/test_check_internal_paths.py && python scripts/check_internal_paths.py
      - name: Every commit is signed off (DCO)
        if: github.event_name == 'pull_request'
        run: python scripts/test_check_dco.py && python scripts/check_dco.py "origin/${{ github.base_ref }}" HEAD
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
            companion/package-lock.json
      - run: npm ci
        working-directory: kb
      - run: npm ci
        working-directory: web
      - run: npm test -- --maxWorkers=2 && npm run typecheck
        working-directory: kb
      - run: npm test && npm run lint && npm run build
        working-directory: web
      - run: npm ci && npm test && npm run typecheck
        working-directory: companion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python addon/tests/event_identity.py && python addon/tests/collection_contract.py && python addon/tests/auction_contract.py && python addon/tests/gold_contract.py && python addon/tests/ask_contract.py && python addon/tests/recipes_contract.py && python addon/tests/addons_contract.py && python addon/tests/mapbounds_contract.py && python addon/tests/talents_contract.py && python addon/tests/plan_contract.py
      - run: python scripts/package-addon.py && git diff --exit-code -- web/public/downloads
      - run: python addon/tests/answers_contract.py
