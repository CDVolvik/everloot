name: Refresh ecosystem
# GitHub facts for the projects in kb/curated/ecosystem.json, behind /addons/ecosystem. Every 6 hours, no
# faster; the command skips any project read less than 3 hours ago and stops on a long rate limit. It never
# pushes to main and never merges: new data goes to one rolling pull request from the branch data/ecosystem,
# and a maintainer merges it. Every merge deploys the site.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ecosystem-refresh
  cancel-in-progress: false
jobs:
  collect:
    # Reads GitHub's public API and writes one file. The read-only default token only lifts the rate limit.
    if: github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Start from the open data pull request, if there is one
        run: |
          git fetch --depth=1 origin data/ecosystem:refs/remotes/origin/data/ecosystem || exit 0
          git checkout origin/data/ecosystem -- kb/changes/ecosystem.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            kb/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: kb
      # The knowledge-base CLI imports a few helpers from web/.
      - run: npm ci
        working-directory: web
      - name: Read GitHub
        run: npm run kb -- ecosystem-check
        working-directory: kb
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem
          path: kb/changes/ecosystem.json
          retention-days: 1
  publish:
    # The only job with a write token, and only the step that pushes and opens the pull request sees it.
    needs: collect
    if: github.repository == 'Everloot/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ecosystem
          path: kb/changes
      - name: Is there anything new?
        id: news
        run: |
          # Every run moves the read times. Only a changed fact is worth a pull request.
          meaningful() { grep -E '^[+-] ' | grep -vE '^[+-]\s+"(at|fetchedAt|refreshedAt)":' | grep -q .; }
          git add kb/changes/ecosystem.json
          news=no
          if git diff --cached -U0 -- kb/changes | meaningful; then news=yes; fi
          if [ "$news" = yes ] && git rev-parse -q --verify origin/data/ecosystem >/dev/null; then
            news=no
            if git diff -U0 origin/data/ecosystem -- kb/changes | meaningful; then news=yes; fi
          fi
          echo "news=$news" >> "$GITHUB_OUTPUT"
      - name: Update the rolling pull request
        if: steps.news.outputs.news == 'yes'
        env:
          GH_TOKEN: ${{ secrets.BUILD_WATCH_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'everloot-ecosystem[bot]'
          git config user.email 'hello@everloot.app'
          git checkout -q -B data/ecosystem
          git commit -s -q -m 'Ecosystem: refresh GitHub facts'
          lease=$(git rev-parse -q --verify origin/data/ecosystem || true)
          git push --force-with-lease="data/ecosystem:${lease}" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data/ecosystem
          if [ -z "$(gh pr list --repo "$REPO" --head data/ecosystem --state open --json number --jq '.[0].number')" ]; then
            gh pr create --repo "$REPO" --base main --head data/ecosystem \
              --title 'data(kb): refresh GitHub facts for the ecosystem tracker' \
              --body 'Automatic refresh of kb/changes/ecosystem.json: stars, releases, commits, issues and the .toc interface numbers of the projects in kb/curated/ecosystem.json, read from GitHub public API. The Refresh ecosystem workflow keeps this one pull request up to date. It never merges it: a maintainer does, and every merge deploys the site.'
          fi
