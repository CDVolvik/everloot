name: Refresh changes
# The blue tracker and build registry behind /changes. Every 30 minutes, no faster: the ingester
# reads robots.txt, skips sources asked less than 25 minutes ago and stops on 429 or a server error.
# It never pushes to main, because every merge to main deploys the site. New data goes to one rolling
# pull request from the branch data/changes, which Carlos merges.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: changes-refresh
  cancel-in-progress: false
jobs:
  collect:
    # Reads the public internet and writes files. No token, no write access.
    if: github.repository == 'CDVolvik/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.blue.outcome == 'failure' || steps.builds.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Start from the open data pull request, if there is one
        run: |
          git fetch --depth=1 origin data/changes:refs/remotes/origin/data/changes || exit 0
          git checkout origin/data/changes -- kb/changes
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: kb/package-lock.json
      - run: npm ci
        working-directory: kb
      - name: Blue posts (Blizzard forum staff accounts and the official WoW Bluesky feed)
        id: blue
        continue-on-error: true
        run: npm run kb -- blue-check
        working-directory: kb
      - name: Builds (Blizzard's public version service)
        id: builds
        continue-on-error: true
        run: npm run kb -- builds-check --registry changes/builds.json
        working-directory: kb
      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: kb/changes
          retention-days: 1
  publish:
    # The only job with a write token, and only the last step sees it.
    needs: collect
    if: github.repository == 'CDVolvik/everloot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: kb/changes
      - name: Is there anything new?
        id: news
        run: |
          # Every run moves the "last asked" and "last seen" times. Only a new or changed post or build
          # is worth a pull request, against main and against what the open pull request already holds.
          meaningful() { grep -E '^[+-] ' | grep -vE '^[+-]\s+"(at|lastSeen)":' | grep -q .; }
          git add kb/changes
          news=no
          if git diff --cached -U0 -- kb/changes | meaningful; then news=yes; fi
          if [ "$news" = yes ] && git rev-parse -q --verify origin/data/changes >/dev/null; then
            news=no
            if git diff -U0 origin/data/changes -- kb/changes | meaningful; then news=yes; fi
          fi
          echo "news=$news" >> "$GITHUB_OUTPUT"
      - name: Update the rolling pull request
        if: steps.news.outputs.news == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'everloot-changes[bot]'
          git config user.email 'hello@everloot.app'
          git checkout -q -B data/changes
          git commit -s -q -m 'Changes: refresh blue posts and builds'
          lease=$(git rev-parse -q --verify origin/data/changes || true)
          git push --force-with-lease="data/changes:${lease}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data/changes
          if [ -z "$(gh pr list --repo "$REPO" --head data/changes --state open --json number --jq '.[0].number')" ]; then
            gh pr create --repo "$REPO" --base main --head data/changes \
              --title 'Changes: new blue posts and builds' \
              --body 'Automatic refresh of kb/changes: new or changed Blizzard posts and game builds. Merging deploys the site. This one pull request is kept up to date by the Refresh changes workflow; it is never merged automatically.'
          fi
      - name: Fail the run if a source failed, so it shows up
        if: needs.collect.outputs.failed == 'true'
        run: exit 1
